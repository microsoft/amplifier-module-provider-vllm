[project]
name = "amplifier-module-provider-vllm"
version = "1.0.0"
description = "vLLM provider module - OpenAI-compatible API integration for Amplifier"
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Microsoft MADE:Explorations Team" },
]
dependencies = [
    # Upper bound intentional: openai SDK 2.54+ (including all 3.x) changed the
    # Responses API usage/InputTokensDetails shape (added a required
    # cache_write_tokens field) and dropped the httpx dependency in favor of
    # httpx2. This suite's fixtures assume the pre-2.54 shape, so 2.54+ fails
    # 38 tests with pydantic ValidationError: InputTokensDetails.cache_write_tokens
    # Field required. Revisit this bound only after refreshing the affected
    # fixtures (test_verbosity_collapse / test_reasoning_effort / test_tool_repair
    # / test_retry) to match the newer shape.
    "openai>=1.0.0,<2.9",
    "openai-harmony>=0.0.8",
]

[project.entry-points."amplifier.modules"]
provider-vllm = "amplifier_module_provider_vllm:mount"

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = [
    "amplifier_module_provider_vllm",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
asyncio_mode = "strict"

[dependency-groups]
dev = [
    "amplifier-core>=1.6.0",
    "httpx>=0.27.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.10",
]

