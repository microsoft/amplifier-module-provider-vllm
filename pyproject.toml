[project]
name = "amplifier-module-provider-vllm"
version = "1.0.0"
description = "vLLM provider module - OpenAI-compatible API integration for Amplifier"
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Microsoft MADE:Explorations Team" },
]
dependencies = [
    # Usage injection supports the required cache_write_tokens field in newer
    # SDKs. CI covers retained 2.x clients and the 3.x SDK's own HTTP transport.
    # Requalify before admitting another major SDK.
    "openai>=2.8.1,<4",
    "openai-harmony>=0.0.8",
]

[project.entry-points."amplifier.modules"]
provider-vllm = "amplifier_module_provider_vllm:mount"

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = [
    "amplifier_module_provider_vllm",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
pythonpath = ["."]
asyncio_mode = "strict"
markers = [
    "live: requires a reachable vLLM/OpenAI-compatible server; deselected in CI via `-m \"not live\"`",
]

[dependency-groups]
dev = [
    "amplifier-core>=1.6.0",
    "httpx>=0.27.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.10",
]

