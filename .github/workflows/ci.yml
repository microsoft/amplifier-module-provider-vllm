name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest (py${{ matrix.python-version }}, openai${{ matrix.openai-version }})
    runs-on: ubuntu-latest
    # A hang must fail LOUDLY and fast, not sit burning runner time until the
    # 6h default -- a job stuck at "in_progress" reads as "not done yet"
    # rather than "broken", which is how a false green gets merged.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # requires-python = ">=3.11" -- cover the floor and a current minor.
        python-version: ["3.11", "3.12"]
        # Retained SDK, native-compaction floor, newer 2.x usage shape, and
        # current 3.x transport. Each install resolves declared requirements.
        openai-version: ["2.8.1", "2.9.0", "2.53.0", "3.22.1"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv lock --upgrade-package "openai==${{ matrix.openai-version }}"
          uv sync --locked --all-extras --dev

      - name: Verify effective SDK version
        run: uv run --no-sync python -c "import openai; assert openai.__version__ == '${{ matrix.openai-version }}', openai.__version__; print('Qualified SDK', openai.__version__)"

      - name: Run test suite
        # Deselects tests marked `live`: the inherited
        # test_list_models_returns_list makes a real network call to
        # the configured vLLM/OpenAI-compatible endpoint. Run locally
        # against a real server to validate.
        run: uv run --no-sync pytest -q -m "not live"
